name: Next.js migration checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/nextjs-migration]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:journey
      - run: pnpm test:source
      - run: pnpm test:v22-scroll
      - run: pnpm inventory:v22
      - run: pnpm extract:v22-svg
      - name: Audit approved v22 resources when present
        run: |
          if test -f public/legacy/index.html; then
            pnpm audit:v22
          else
            echo "::warning::Approved v22 source files are not committed; visual parity remains blocked."
          fi
      - run: pnpm build
